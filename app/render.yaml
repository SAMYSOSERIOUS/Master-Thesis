services:
  - type: web
    name: knee-oa-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KNEE_MODEL_MODE
        value: stub
      - key: ALLOWED_ORIGINS
        value: "*"
